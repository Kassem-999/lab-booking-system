<div class="register-page"><div class="register-card"><a class="back-link" routerLink="/">← Back to LabSync</a><div class="eyebrow">JOIN UNIVERSITY LABS</div><h1>Create your account</h1><p>Start discovering and reserving the resources your work needs.</p><div *ngIf="errorMessage" class="error">{{ errorMessage }}</div><form (ngSubmit)="register()" #formRef="ngForm"><label>Full name<input name="name" [(ngModel)]="form.name" required placeholder="Your name" /></label><label>University email<input type="email" name="email" [(ngModel)]="form.email" required placeholder="you@university.edu" /></label><label>Password<input type="password" name="password" [(ngModel)]="form.password" minlength="6" required placeholder="At least 6 characters" /></label><button type="submit" [disabled]="formRef.invalid || isLoading">{{ isLoading ? 'Creating account…' : 'Create account' }}</button></form><div class="switch">Already have an account? <a routerLink="/login">Sign in</a></div></div></div>
