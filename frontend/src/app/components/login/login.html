<div class="auth-page">
  <div class="auth-card">
    <a class="back-link" routerLink="/">← Back to LabSync</a>
    <div class="eyebrow">UNIVERSITY LABS</div>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to browse and reserve the resources your work needs.</p>
    <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <label for="email">University email
        <input type="email" id="email" name="email" [(ngModel)]="credentials.email" required placeholder="you@university.edu" />
      </label>
      <label for="password">Password
        <input type="password" id="password" name="password" [(ngModel)]="credentials.password" required placeholder="Your password" />
      </label>
      <button type="submit" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="isLoading" class="spinner"></span>
        {{ isLoading ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
    <div class="switch">Need an account? <a routerLink="/register">Create one</a></div>
  </div>
</div>
